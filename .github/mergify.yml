pull_request_rules:
  - name: Auto-merge Dependabot PRs into main
    conditions:
      - base = main
      - author = dependabot[bot]
      - check-success = Unit tests (ubuntu-latest)
      - check-success = Unit tests (windows-latest)
      - check-success = Unit tests (macos-latest)
      - check-success = API tests
    actions:
      merge:
        method: squash
